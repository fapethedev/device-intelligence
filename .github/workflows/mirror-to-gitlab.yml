name: Mirror to GitLab

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: gitlab-mirror-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync repository to GitLab
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_HOST: ${{ vars.GITLAB_HOST || secrets.GITLAB_HOST || 'gitlab.com' }}
          GITLAB_PROJECT_PATH: ${{ vars.GITLAB_PROJECT_PATH || secrets.GITLAB_PROJECT_PATH || github.repository }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "::error::Secret GITLAB_TOKEN is not configured in GitHub repository secrets."
            exit 1
          fi

          echo "Configuring GitLab remote for ${GITLAB_PROJECT_PATH} on ${GITLAB_HOST}..."
          
          # Fetch all branches and tags from GitHub origin
          git fetch --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'

          # Remove origin/HEAD reference to avoid pushing an invalid 'refs/heads/HEAD' ref
          git update-ref -d refs/remotes/origin/HEAD 2>/dev/null || true

          # Configure GitLab remote with authentication token masked
          GITLAB_REMOTE_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_HOST}/${GITLAB_PROJECT_PATH}.git"
          git remote add gitlab "$GITLAB_REMOTE_URL"

          echo "Synchronizing branches to GitLab..."
          git push --prune gitlab '+refs/remotes/origin/*:refs/heads/*'

          echo "Synchronizing tags to GitLab..."
          git push gitlab --tags

          echo "Repository successfully synchronized to GitLab!"
